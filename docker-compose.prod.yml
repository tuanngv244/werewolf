services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: werewolf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-werewolf}
      POSTGRES_USER: ${POSTGRES_USER:-werewolf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-werewolf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - werewolf-network

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    container_name: werewolf-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - werewolf-network

  # ─── NestJS API Server ───
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: werewolf-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-werewolf}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-werewolf}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://wolf.nguynchupanh.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - werewolf-network

  # ─── Next.js Client ───
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://wolf.nguynchupanh.com/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://wolf.nguynchupanh.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Werewolf Game}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    container_name: werewolf-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - server
    networks:
      - werewolf-network

  # ─── Nginx Reverse Proxy ───
  # SSL is configured automatically by deploy.sh
  # It swaps nginx.conf → nginx-ssl.conf when certs exist
  nginx:
    image: nginx:alpine
    container_name: werewolf-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - werewolf-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  werewolf-network:
    driver: bridge
