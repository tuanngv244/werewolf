# ═══════════════════════════════════════════════════════════
# Upstreams — use explicit container names to avoid DNS
# conflicts on the shared werewolf-network
# ═══════════════════════════════════════════════════════════

# Docker internal DNS resolver — forces nginx to re-resolve
# container IPs dynamically instead of caching at startup
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

# ═══════════════════════════════════════════════════════════
# Werewolf Game — werewolf.ans-game.fun
# ═══════════════════════════════════════════════════════════

# ─── Port 80 — HTTP ───
# Cloudflare "Flexible" mode connects here.
# NO redirects — just serve content. Cloudflare already handles HTTPS for the user.
server {
    listen 80;
    server_name werewolf.ans-game.fun;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 10M;

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API — strips /api/ prefix (variable proxy_pass keeps original URI,
    # so we use rewrite to strip /api/ before forwarding)
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        set $werewolf_server_target werewolf-server:3001;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$werewolf_server_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.io — use $request_uri to pass the original path as-is
    # (when proxy_pass uses a variable, nginx does NOT auto-strip the
    #  location prefix, so we must NOT append /socket.io/ to the target)
    location /socket.io/ {
        set $werewolf_server_target werewolf-server:3001;
        proxy_pass http://$werewolf_server_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Next.js client
    location / {
        limit_req zone=general burst=30 nodelay;

        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets
    location /_next/static/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 60d;
        add_header Cache-Control "public, max-age=5184000, immutable";
    }

    location /models/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /textures/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /sounds/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /images/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# ─── Port 443 — HTTPS ───
# Cloudflare "Full" or "Full (Strict)" mode connects here.
server {
    listen 443 ssl http2;
    server_name werewolf.ans-game.fun;

    # SSL certificates (Cloudflare Origin)
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 10M;

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
