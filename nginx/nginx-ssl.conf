    }

    location /sounds/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /images/ {
        set $werewolf_client_target werewolf-client:3000;
        proxy_pass http://$werewolf_client_target;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

